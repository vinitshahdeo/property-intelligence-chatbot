services:
  - type: web
    name: property-intelligence-chatbot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: property-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INGEST_TOKEN
        generateValue: true
      - key: MAX_CRAWL_PAGES
        value: "35"
