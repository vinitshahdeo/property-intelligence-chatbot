# fly.toml app configuration file generated for property-intelligence-chatbot on 2026-11-18T08:20:14Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'property-intelligence-chatbot'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
