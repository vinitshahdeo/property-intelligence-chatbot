<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Ask questions about public property listings from Wasalt and DarGlobal, with every answer linked to its source.">
<title>Property Intelligence</title>
<style>
:root{
  --bg:#fbfaf7;--surface:#ffffff;--sunken:#f2f0ea;--ink:#16150f;--ink-2:#55534b;--ink-3:#8b887e;
  --line:#e6e3da;--accent:#1f5f4a;--accent-ink:#ffffff;--danger:#a23b2a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121210;--surface:#1a1a17;--sunken:#20201c;--ink:#efede6;--ink-2:#b4b1a6;--ink-3:#7f7c72;
  --line:#2c2b26;--accent:#7fc4a6;--accent-ink:#0f1a15;--danger:#e58a78;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.top-in{max-width:760px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.wordmark{font-family:var(--serif);font-size:18px;letter-spacing:-.01em;text-decoration:none}
.wordmark i{color:var(--ink-3);font-style:italic}
.ghost{background:none;border:0;padding:6px 10px;margin-right:-10px;border-radius:8px;color:var(--ink-2);font-size:14px;cursor:pointer}
.ghost:hover{color:var(--ink);background:var(--sunken)}
.ghost[hidden]{display:none}

/* layout */
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:0 24px 200px}

/* intro */
.intro{padding:14vh 0 0}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.intro p{margin:0;color:var(--ink-2);max-width:520px}
.coverage{font-variant-numeric:tabular-nums;color:var(--ink)}
.prompts{list-style:none;margin:44px 0 0;padding:0;border-top:1px solid var(--line)}
.prompts button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 2px;cursor:pointer;color:var(--ink-2);transition:color .15s,padding .2s}
.prompts button:hover{color:var(--ink);padding-left:8px}
.prompts svg{flex:none;opacity:.35;transition:opacity .15s,transform .2s}
.prompts button:hover svg{opacity:1;transform:translateX(2px)}

/* thread */
.thread{display:flex;flex-direction:column;gap:36px;padding-top:28px}
.q{align-self:flex-end;max-width:85%;background:var(--sunken);padding:10px 16px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{animation:rise .35s ease both}
.a .body{overflow-wrap:anywhere}
.a .body p{margin:0 0 12px}
.a .body ul,.a .body ol{margin:0 0 12px;padding-left:20px}
.a .body li{margin:0 0 8px;padding-left:2px}
.a .body h4{font-size:15px;margin:18px 0 6px}
.a .body strong{font-weight:600}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin:0 1px;border-radius:5px;background:var(--sunken);color:var(--ink-2);font-size:11px;font-weight:600;text-decoration:none;vertical-align:2px;font-variant-numeric:tabular-nums}
.cite:hover{background:var(--accent);color:var(--accent-ink)}
.meta{margin-top:6px;font-size:12px;color:var(--ink-3)}
.err{color:var(--danger)}

/* sources */
.sources{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.src{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;transition:border-color .15s,transform .15s}
.src:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.src:target,.src.flash{border-color:var(--accent)}
.src-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.src-t{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src-m{margin-top:auto;font-size:12.5px;line-height:1.45;color:var(--ink-2);font-variant-numeric:tabular-nums}
.src-m b{color:var(--ink);font-weight:600;white-space:nowrap}

/* thinking */
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* composer */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 24px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer{max-width:712px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 30px rgb(0 0 0/.06);transition:border-color .15s}
.composer:focus-within{border-color:var(--ink-3)}
.composer textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--ink);font:inherit;padding:8px 0;max-height:180px;line-height:1.5}
.composer textarea::placeholder{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{flex:none;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--ink);color:var(--bg);cursor:pointer;transition:opacity .15s,transform .1s}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.18;cursor:default}
.fine{max-width:712px;margin:10px auto 0;text-align:center;font-size:12px;color:var(--ink-3)}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .top-in,main{padding-left:18px;padding-right:18px}.dock{padding-left:12px;padding-right:12px}
  .intro{padding-top:8vh}.sources{grid-template-columns:1fr}.q{max-width:92%}.fine{font-size:11px;margin-top:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="wordmark" href="/">Property <i>Intelligence</i></a>
    <button class="ghost" id="reset" type="button" hidden>New chat</button>
  </div>
</header>

<main>
  <section class="intro" id="intro">
    <h1>What are you<br>looking for?</h1>
    <p>Ask about homes, land and rentals across Saudi Arabia. Answers are drawn from <span class="coverage" id="coverage">public listings</span> and link back to the original source.</p>
    <ul class="prompts" id="prompts">
      <li><button type="button">Three-bedroom apartments for rent in Riyadh</button></li>
      <li><button type="button">Villas for sale in Jeddah</button></li>
      <li><button type="button">Land for sale in Khobar</button></li>
      <li><button type="button">Chalets for daily rental in Taif</button></li>
    </ul>
  </section>
  <section class="thread" id="thread" aria-live="polite" aria-label="Conversation"></section>
</main>

<div class="dock">
  <form class="composer" id="form">
    <label for="q" class="sr">Ask a question</label>
    <textarea id="q" rows="1" placeholder="Ask about a city, home type or budget…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" disabled aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <p class="fine">Listings change often. Confirm price and availability with the source before deciding.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const thread = $('#thread'), intro = $('#intro'), form = $('#form'), input = $('#q'), send = $('#send'), reset = $('#reset');
const arrow = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const nf = new Intl.NumberFormat('en');
let history = [], turn = 0, busy = false;

document.querySelectorAll('.prompts button').forEach(b => b.insertAdjacentHTML('beforeend', arrow));

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function inline(s, id, n) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (m, list) => list.split(/\s*,\s*/).map(k =>
      +k >= 1 && +k <= n ? `<a class="cite" href="#s${id}-${k}" data-k="${k}">${k}</a>` : `[${k}]`).join(''));
}

function render(md, id, n) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    let m;
    if (!line) { close(); continue; }
    if ((m = line.match(/^[-*•]\s+(.*)/)) || (m = line.match(/^\d+[.)]\s+(.*)/))) {
      const kind = /^\d/.test(line) ? 'ol' : 'ul';
      if (list !== kind) { close(); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline(m[1], id, n)}</li>`); continue;
    }
    close();
    if ((m = line.match(/^#{1,6}\s+(.*)/))) out.push(`<h4>${inline(m[1], id, n)}</h4>`);
    else out.push(`<p>${inline(line, id, n)}</p>`);
  }
  close();
  return out.join('');
}

function fmtPrice(p) {
  const m = (p || '').match(/^\s*([\d.,]+)\s*([A-Z]{3})?\s*(\/\s*\w+)?/);
  if (!m) return p || '';
  const unit = {'/year': '/yr', '/month': '/mo', '/day': '/night'}[(m[3] || '').replace(/\s/g, '').toLowerCase()] || '';
  return `${m[2] || 'SAR'} ${nf.format(Math.round(parseFloat(m[1].replace(/,/g, ''))))}${unit}`;
}

function sourceCard(s, id) {
  const a = document.createElement('a');
  a.className = 'src'; a.id = `s${id}-${s.index}`; a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  const parts = (s.location || '').split(',').map(x => x.trim()).filter(x => x && x !== 'Saudi Arabia');
  const loc = parts.length > 1 ? `${parts[0]}, ${parts[1]}` : parts[0] || '';
  const meta = [s.price && `<b>${esc(fmtPrice(s.price))}</b>`, loc && esc(loc), !s.price && !loc && s.property_type && esc(s.property_type)].filter(Boolean).join(' · ');
  a.innerHTML = `<span class="src-h"><span>${esc(s.source)}</span><span>${s.index}</span></span>
    <span class="src-t">${esc(s.title.replace(/\s+–\s+Wasalt.*$/, ''))}</span>${meta ? `<span class="src-m">${meta}</span>` : ''}`;
  return a;
}

function start() {
  intro.hidden = true; reset.hidden = false;
}

function ask(q) {
  if (busy || !q.trim()) return;
  busy = true; start();
  const id = ++turn;
  const qEl = document.createElement('div'); qEl.className = 'q'; qEl.textContent = q;
  const aEl = document.createElement('article'); aEl.className = 'a';
  aEl.innerHTML = '<div class="thinking"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>Searching listings</div>';
  thread.append(qEl, aEl);
  qEl.scrollIntoView({behavior: 'smooth', block: 'start'});
  input.value = ''; grow(); sync();

  fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: q, history})})
    .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Request failed'); return d; })
    .then(d => {
      const sources = d.sources || [];
      aEl.innerHTML = `<div class="body">${render(d.answer || '', id, sources.length)}</div>`;
      if (sources.length) {
        const grid = document.createElement('div'); grid.className = 'sources';
        sources.forEach(s => grid.appendChild(sourceCard(s, id)));
        aEl.appendChild(grid);
      }
      if (d.mode !== 'openrouter') aEl.insertAdjacentHTML('beforeend', '<div class="meta">Showing closest matching listings · AI summary unavailable</div>');
      history.push({role: 'user', content: q}, {role: 'assistant', content: d.answer});
      history = history.slice(-8);
    })
    .catch(e => { aEl.innerHTML = `<p class="err">Something went wrong: ${esc(e.message)}. Please try again.</p>`; })
    .finally(() => { busy = false; sync(); input.focus(); });
}

thread.addEventListener('click', e => {
  const c = e.target.closest('.cite'); if (!c) return;
  e.preventDefault();
  const card = document.getElementById(c.getAttribute('href').slice(1));
  if (!card) return;
  card.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200);
});

function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
function sync() { send.disabled = busy || !input.value.trim(); }
input.addEventListener('input', () => { grow(); sync(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value.trim()); } });
form.addEventListener('submit', e => { e.preventDefault(); ask(input.value.trim()); });
document.querySelectorAll('.prompts button').forEach(b => b.addEventListener('click', () => ask(b.textContent.trim())));
reset.addEventListener('click', () => { thread.replaceChildren(); history = []; intro.hidden = false; reset.hidden = true; input.focus(); window.scrollTo({top: 0}); });

fetch('/api/stats').then(r => r.json()).then(d => {
  const parts = Object.entries(d.by_source || {}).filter(([, n]) => n > 0).map(([k]) => k);
  if (d.documents) $('#coverage').textContent = `${nf.format(d.documents)} public property pages from ${parts.join(' and ') || 'indexed sources'}`;
}).catch(() => {});
input.focus();
</script>
</body>
</html>
